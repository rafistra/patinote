# cargo-deny configuration. Every dependency must use a license compatible
# with MIT (docs/PRD.md, Platform). Extend `allow` only when a new dependency
# needs it, and say so in the PR.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    # ryu (via serde_norway) is Apache-2.0 OR BSL-1.0; Iced also needs it (design 0002).
    "Apache-2.0",
    # unicode-ident (via proc-macro2, used by clap_derive): permissive Unicode data license.
    "Unicode-3.0",
    # foldhash (via hashbrown, used by rusqlite); Iced also needs it (design 0002).
    "Zlib",
    # notify (file watcher, F-04) is CC0-1.0, a public-domain dedication; Iced also needs it (design 0002).
    "CC0-1.0",
    # inotify (via notify) is ISC, equivalent to MIT; Iced also needs it (design 0002).
    "ISC",
    # tiny-skia (the default renderer, Q-004) and arrayref (via tiny-skia) are
    # BSD-3-Clause and BSD-2-Clause; permissive, design 0002 section 5.3.
    "BSD-2-Clause",
    "BSD-3-Clause",
    # clipboard-win and error-code (Iced's clipboard; Windows only but in the
    # graph) are BSL-1.0, permissive; design 0002 section 5.3.
    "BSL-1.0",
]
confidence-threshold = 0.9

[advisories]
ignore = [
    # chrono is unmaintained (informational, no vulnerability, no fix). rmcp
    # (MCP server, A-04) requires it; remove this when rmcp drops chrono. Q-010.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono, required by rmcp; Q-010" },
]

[licenses.private]
# Workspace crates are not published; their own license is in LICENSE.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version; all are publish = false.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
