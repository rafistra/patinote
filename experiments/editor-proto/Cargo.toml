[package]
name = "editor-proto"
description = "Throwaway editor prototype for step 0.6 (docs/design/0002-editor-dan-renderer.md)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Kept out of the main workspace so that Iced stays out of its Cargo.lock until
# the version is locked in design 0002.
[workspace]

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "crisp", "thread-pool", "tiny-skia", "wgpu", "wayland", "x11"] }
iced_runtime = "=0.14.0"
png = "0.18"

[lints.rust]
unsafe_code = "deny"
