[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/rafistra/patinote"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
