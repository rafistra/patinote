[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/rafistra/patinote"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = "4.6.12"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
ctrlc = "3.5.3"
ignore = "0.4.34"
insta = { version = "1.49.0", features = ["json"] }
notify = { version = "8.2.2", default-features = false }
patinote-core = { path = "crates/patinote-core" }
patinote-index = { path = "crates/patinote-index" }
pulldown-cmark = { version = "0.13.6", default-features = false }
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rusqlite_migration = "2.7.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "io-std", "macros", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
unicode-normalization = "0.1.26"
vaultgen = { path = "tools/vaultgen" }

[workspace.lints.rust]
unsafe_code = "deny"
