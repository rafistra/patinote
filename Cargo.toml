[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/rafistra/patinote"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
ignore = "0.4.34"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
vaultgen = { path = "tools/vaultgen" }

[workspace.lints.rust]
unsafe_code = "deny"
